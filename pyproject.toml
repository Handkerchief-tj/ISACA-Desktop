[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaca-desktop"
version = "0.1.0"
description = "Desktop symbolic analog-circuit analyzer based on SLiCAP 5.2.1 and SFG simplification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SLiCAP==5.2.1",
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "graphviz>=0.20,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "scipy>=1.10,<2",
    "sympy>=1.13,<2",
]

[project.scripts]
isaca-desktop = "isaca_desktop.__main__:main"

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
]
deploy = [
    "nuitka>=2.7",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["isaca_api*", "isaca_desktop*", "sfg_prototype*"]
namespaces = false

[tool.setuptools.package-data]
isaca_desktop = ["resources/*.py", "resources/katex/*", "resources/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
